<div class="container mt-4">
  <h3>Registered Users</h3>

  <form class="row g-2 mb-3" (ngSubmit)="applyFilters()">
    <div class="col-md-3">
      <input class="form-control" [(ngModel)]="searchParams.firstName" name="firstName" placeholder="First name" />
    </div>
    <div class="col-md-3">
      <input class="form-control" [(ngModel)]="searchParams.lastName" name="lastName" placeholder="Last name" />
    </div>
    <div class="col-md-3">
      <input class="form-control" [(ngModel)]="searchParams.email" name="email" placeholder="Email" />
    </div>
    <div class="col-md-1">
      <input type="number" class="form-control" [(ngModel)]="searchParams.minPosts" name="minPosts" placeholder="Min posts" />
    </div>
    <div class="col-md-1">
      <input type="number" class="form-control" [(ngModel)]="searchParams.maxPosts" name="maxPosts" placeholder="Max posts" />
    </div>
    <div class="col-md-1 d-grid">
      <button class="btn btn-primary" type="submit">Filter</button>
    </div>
    <div class="col-md-1 d-grid">
      <button type="button" class="btn btn-outline-secondary" (click)="clearFilters()">Clear</button>
    </div>
  </form>

  <div class="mb-2">
    <button class="btn btn-sm btn-outline-dark me-2" (click)="sortUsers('email')">Sort by Email</button>
    <button class="btn btn-sm btn-outline-dark me-2" (click)="sortUsers('followingCount')">Sort by Following</button>
    <button class="btn btn-sm btn-outline-dark" (click)="toggleOrder()">Toggle {{ order | uppercase }}</button>
  </div>

  <div class="list-group">
    <div class="list-group-item" *ngFor="let u of users">
      <div class="d-flex justify-content-between">
        <div>
          <strong>{{ u.firstName }} {{ u.lastName }}</strong>
          <div class="text-muted small">{{ u.email }}</div>
        </div>
        <div class="text-end small">
          <div>Posts: {{ u.postsCount ?? u.postCount ?? 0 }}</div>
          <div>Following: {{ u.followingCount ?? 0 }}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-3 d-flex justify-content-between">
    <button class="btn btn-outline-secondary" (click)="prevPage()">Prev</button>
    <button class="btn btn-outline-secondary" (click)="nextPage()">Next</button>
  </div>
</div>
