<div class="container mt-5">
  <h2>Posts</h2>

  <div *ngIf="posts.length === 0">
    <p>No posts available at the moment.</p>
  </div>

  <div *ngFor="let post of posts; trackBy: trackByPostId" class="card mb-3 post-card">
    <div class="card-body">
      <img *ngIf="post.image" [src]="post.image" class="card-img-top" alt="Post Image" />
      <h5 class="card-title">
        <a [routerLink]="['/posts', post.id]">{{ post.description }}</a>
      </h5>
      <p class="card-text">Likes: {{ post.likesCount }}</p>

      <p class="card-text">
        Posted by:
        <a [routerLink]="['/user-profile', post.userId]">
          {{ post.userId || ('User #' + post.userId) }}
        </a>
      </p>

      <!-- Like / Unlike / Toggle -->
      <div class="d-flex gap-2 mb-2">
        <button class="btn btn-outline-primary btn-sm" (click)="like(post)">Like</button>
        <button class="btn btn-outline-secondary btn-sm" (click)="unlike(post)">Unlike</button>
        <button class="btn btn-link btn-sm" (click)="toggleComments(post)">
          {{ commentVisible[post.id] ? 'Hide comments' : 'Show comments' }}
        </button>
      </div>

      <!-- Komentari -->
      <div *ngIf="commentVisible[post.id]">
        <div class="list-group mb-2">
          <div class="list-group-item" *ngFor="let c of post.comments; trackBy: trackByCommentId">
            {{ c.content }}
          </div>
        </div>

        <textarea
          [(ngModel)]="newCommentText[post.id]"
          class="form-control"
          placeholder="Add a comment..."
        ></textarea>
        <button
          class="btn btn-primary mt-2"
          [disabled]="submittingComment[post.id]"
          (click)="addComment(post)"
        >
          {{ submittingComment[post.id] ? 'Adding...' : 'Add Comment' }}
        </button>
      </div>
    </div>
  </div>
</div>
